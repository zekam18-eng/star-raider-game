<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Star Raider</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
    cursor: none;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-right, 0px) + 22px) 0 calc(env(safe-area-inset-left, 0px) + 22px);
    pointer-events: none;
    z-index: 10;
  }
  .hud-box {
    color: #eafcff;
    text-shadow: 0 0 10px rgba(0,220,255,0.8), 0 0 2px #000;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  #score { font-size: 30px; }
  #best { font-size: 15px; opacity: 0.75; margin-top: 2px; }
  #rightHud {
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  }
  #hpWrap {
    display: flex; gap: 6px;
  }
  .hp-pip {
    width: 22px; height: 10px;
    background: linear-gradient(180deg,#00e5ff,#0072ff);
    border-radius: 3px;
    box-shadow: 0 0 8px rgba(0,200,255,0.9);
    transition: opacity .2s, transform .2s;
  }
  .hp-pip.off {
    background: rgba(255,255,255,0.08);
    box-shadow: none;
  }
  #shieldWrap {
    display: flex; gap: 5px;
  }
  .shield-pip {
    width: 14px; height: 14px;
    background: linear-gradient(180deg,#ffe98a,#ffb300);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    box-shadow: 0 0 8px rgba(255,190,0,0.9);
  }
  #upgradeOverlay {
    position: absolute;
    top:0; left:0; width:100%; height:100%;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
    background: radial-gradient(ellipse at center, rgba(5,10,25,0.6) 0%, rgba(2,4,12,0.94) 100%);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  #upgradeOverlay .box {
    text-align: center;
    padding: 26px 30px;
    max-width: 320px;
  }
  #upgradeOverlay h2 {
    color: #ffd76a;
    font-size: 24px;
    letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(255,215,100,0.6);
    margin-bottom: 6px;
  }
  #upgradeOverlay .sub {
    color: #9fdcff;
    font-size: 14px;
    margin-bottom: 22px;
  }
  #upgradeOverlay .choices {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .upgradeBtn {
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #001019;
    background: linear-gradient(180deg,#4be9ff,#00b4ff);
    border: none;
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(0,190,255,0.6), inset 0 -3px 6px rgba(0,0,0,0.25);
    cursor: pointer;
    min-width: 120px;
  }
  .upgradeBtn.shieldBtn {
    background: linear-gradient(180deg,#ffe98a,#ffb300);
    box-shadow: 0 0 20px rgba(255,180,0,0.6), inset 0 -3px 6px rgba(0,0,0,0.25);
  }
  .upgradeBtn.doubleBtn {
    background: linear-gradient(180deg,#c3b3ff,#7a5cff);
    box-shadow: 0 0 20px rgba(122,92,255,0.6), inset 0 -3px 6px rgba(0,0,0,0.25);
  }
  .upgradeBtn.damageBtn {
    background: linear-gradient(180deg,#ff9d9d,#e23b3b);
    box-shadow: 0 0 20px rgba(226,59,59,0.6), inset 0 -3px 6px rgba(0,0,0,0.25);
  }
  .upgradeBtn:active { transform: scale(0.95); }

  #overlay {
    position: absolute;
    top:0; left:0; width:100%; height:100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 20;
    background: radial-gradient(ellipse at center, rgba(5,10,25,0.55) 0%, rgba(2,4,12,0.92) 100%);
    backdrop-filter: blur(2px);
  }
  #overlay h1 {
    font-size: 54px;
    color: #fff;
    letter-spacing: 4px;
    background: linear-gradient(90deg,#00eaff,#7a5cff,#ff4dd8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(120,120,255,0.5);
    margin-bottom: 6px;
  }
  #overlay .sub {
    color: #9fdcff;
    font-size: 15px;
    margin-bottom: 28px;
    letter-spacing: 1px;
    max-width: 320px;
    line-height: 1.5;
  }
  #overlay .finalScore {
    color: #fff;
    font-size: 46px;
    font-weight: 800;
    text-shadow: 0 0 20px rgba(0,220,255,0.8);
  }
  #overlay .finalLabel {
    color: #7fd8ff;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  #overlay .bestLine {
    color: #ffd76a;
    font-size: 14px;
    margin: 10px 0 26px;
    text-shadow: 0 0 12px rgba(255,215,100,0.6);
  }
  #playBtn {
    padding: 16px 46px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #001019;
    background: linear-gradient(180deg,#4be9ff,#00b4ff);
    border: none;
    border-radius: 50px;
    box-shadow: 0 0 25px rgba(0,190,255,0.7), inset 0 -3px 6px rgba(0,0,0,0.25);
    cursor: pointer;
    pointer-events: all;
    transition: transform .12s ease;
  }
  #playBtn:active { transform: scale(0.94); }

  #currencyLine {
    color: #ffd76a;
    font-size: 14px;
    margin-bottom: 10px;
    text-shadow: 0 0 10px rgba(255,215,100,0.5);
    letter-spacing: 0.5px;
  }
  #colorPicker {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin: 4px 0 30px;
    pointer-events: all;
  }
  .colorSwatch {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.22);
    cursor: pointer;
    position: relative;
    transition: transform .12s ease, border-color .12s ease;
  }
  .colorSwatch:active { transform: scale(0.92); }
  .colorSwatch.selected {
    border-color: #fff;
    box-shadow: 0 0 16px rgba(255,255,255,0.65);
    transform: scale(1.08);
  }
  .colorSwatch.locked { opacity: 0.5; }
  .colorSwatch .price {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #eafcff;
    background: rgba(0,0,0,0.55);
    border-radius: 8px;
    padding: 1px 6px;
    white-space: nowrap;
  }

  #hint {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 1px;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- VK Mini Apps: обязательный сигнал платформе, что страница загрузилась.
     Без этого VK бесконечно показывает свой собственный лоадер поверх приложения. -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<script>
  try {
    if (window.vkBridge) {
      vkBridge.send('VKWebAppInit', {});
    }
  } catch (e) {
    // если открыто не внутри VK (просто в браузере) — просто игнорируем
  }
</script>

<canvas id="gameCanvas"></canvas>

<div id="hud" style="display:none">
  <div class="hud-box">
    <div id="score">0</div>
    <div id="best">РЕКОРД: 0</div>
  </div>
  <div id="rightHud">
    <div id="hpWrap"></div>
    <div id="shieldWrap"></div>
  </div>
</div>

<div id="hint" style="display:none">Двигай пальцем/мышью — стрельба идёт сама</div>

<div id="upgradeOverlay">
  <div class="box">
    <h2>УЛУЧШЕНИЕ КОРАБЛЯ</h2>
    <div class="sub">Набрано очков: <span id="upgradeScoreVal">0</span></div>
    <div class="choices">
      <button id="upgradeLifeBtn" class="upgradeBtn">Восполнить жизнь</button>
      <button id="upgradeShieldBtn" class="upgradeBtn shieldBtn">Щит</button>
      <button id="upgradeDoubleBtn" class="upgradeBtn doubleBtn">Двойной выстрел</button>
      <button id="upgradeDamageBtn" class="upgradeBtn damageBtn">Урон +25%</button>
    </div>
  </div>
</div>

<div id="overlay">
  <h1>STAR RAIDER</h1>
  <div class="sub">Уклоняйся, стреляй по роботам-дронам и набирай очки.<br>Одно столкновение — и миссия окончена.</div>
  <div id="currencyLine">Очки за роботов: <span id="currencyVal">0</span></div>
  <div id="colorPicker"></div>
  <button id="playBtn">ИГРАТЬ</button>
</div>


<!-- Игровые модули: порядок важен (background/upgrades/enemies не обёрнуты в функцию,
     поэтому их let/const видны следующим скриптам; game.js подключается последним
     и запускает главный цикл) -->
<script src="background.js"></script>
<script src="upgrades.js"></script>
<script src="enemies.js"></script>
<script src="game.js"></script>
</body>
</html>
