<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Star Raider</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
    cursor: none;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-right, 0px) + 22px) 0 calc(env(safe-area-inset-left, 0px) + 22px);
    pointer-events: none;
    z-index: 10;
  }
  .hud-box {
    color: #eafcff;
    text-shadow: 0 0 10px rgba(0,220,255,0.8), 0 0 2px #000;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  #score { font-size: 30px; }
  #best { font-size: 15px; opacity: 0.75; margin-top: 2px; }
  #rightHud {
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  }
  #hpWrap {
    display: flex; gap: 6px;
  }
  .hp-pip {
    width: 22px; height: 10px;
    background: linear-gradient(180deg,#00e5ff,#0072ff);
    border-radius: 3px;
    box-shadow: 0 0 8px rgba(0,200,255,0.9);
    transition: opacity .2s, transform .2s;
  }
  .hp-pip.off {
    background: rgba(255,255,255,0.08);
    box-shadow: none;
  }
  #shieldWrap {
    display: flex; gap: 5px;
  }
  .shield-pip {
    width: 14px; height: 14px;
    background: linear-gradient(180deg,#ffe98a,#ffb300);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    box-shadow: 0 0 8px rgba(255,190,0,0.9);
  }
  #upgradeOverlay {
    position: absolute;
    top:0; left:0; width:100%; height:100%;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
    background: radial-gradient(ellipse at center, rgba(5,10,25,0.6) 0%, rgba(2,4,12,0.94) 100%);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  #upgradeOverlay .box {
    text-align: center;
    padding: 26px 30px;
    max-width: 320px;
  }
  #upgradeOverlay h2 {
    color: #ffd76a;
    font-size: 24px;
    letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(255,215,100,0.6);
    margin-bottom: 6px;
  }
  #upgradeOverlay .sub {
    color: #9fdcff;
    font-size: 14px;
    margin-bottom: 22px;
  }
  #upgradeOverlay .choices {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .upgradeBtn {
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #001019;
    background: linear-gradient(180deg,#4be9ff,#00b4ff);
    border: none;
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(0,190,255,0.6), inset 0 -3px 6px rgba(0,0,0,0.25);
    cursor: pointer;
    min-width: 120px;
  }
  .upgradeBtn.shieldBtn {
    background: linear-gradient(180deg,#ffe98a,#ffb300);
    box-shadow: 0 0 20px rgba(255,180,0,0.6), inset 0 -3px 6px rgba(0,0,0,0.25);
  }
  .upgradeBtn:active { transform: scale(0.95); }

  #overlay {
    position: absolute;
    top:0; left:0; width:100%; height:100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 20;
    background: radial-gradient(ellipse at center, rgba(5,10,25,0.55) 0%, rgba(2,4,12,0.92) 100%);
    backdrop-filter: blur(2px);
  }
  #overlay h1 {
    font-size: 54px;
    color: #fff;
    letter-spacing: 4px;
    background: linear-gradient(90deg,#00eaff,#7a5cff,#ff4dd8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(120,120,255,0.5);
    margin-bottom: 6px;
  }
  #overlay .sub {
    color: #9fdcff;
    font-size: 15px;
    margin-bottom: 28px;
    letter-spacing: 1px;
    max-width: 320px;
    line-height: 1.5;
  }
  #overlay .finalScore {
    color: #fff;
    font-size: 46px;
    font-weight: 800;
    text-shadow: 0 0 20px rgba(0,220,255,0.8);
  }
  #overlay .finalLabel {
    color: #7fd8ff;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  #overlay .bestLine {
    color: #ffd76a;
    font-size: 14px;
    margin: 10px 0 26px;
    text-shadow: 0 0 12px rgba(255,215,100,0.6);
  }
  #playBtn {
    padding: 16px 46px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #001019;
    background: linear-gradient(180deg,#4be9ff,#00b4ff);
    border: none;
    border-radius: 50px;
    box-shadow: 0 0 25px rgba(0,190,255,0.7), inset 0 -3px 6px rgba(0,0,0,0.25);
    cursor: pointer;
    pointer-events: all;
    transition: transform .12s ease;
  }
  #playBtn:active { transform: scale(0.94); }

  #currencyLine {
    color: #ffd76a;
    font-size: 14px;
    margin-bottom: 10px;
    text-shadow: 0 0 10px rgba(255,215,100,0.5);
    letter-spacing: 0.5px;
  }
  #colorPicker {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin: 4px 0 30px;
    pointer-events: all;
  }
  .colorSwatch {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.22);
    cursor: pointer;
    position: relative;
    transition: transform .12s ease, border-color .12s ease;
  }
  .colorSwatch:active { transform: scale(0.92); }
  .colorSwatch.selected {
    border-color: #fff;
    box-shadow: 0 0 16px rgba(255,255,255,0.65);
    transform: scale(1.08);
  }
  .colorSwatch.locked { opacity: 0.5; }
  .colorSwatch .price {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #eafcff;
    background: rgba(0,0,0,0.55);
    border-radius: 8px;
    padding: 1px 6px;
    white-space: nowrap;
  }

  #hint {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 1px;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- VK Mini Apps: обязательный сигнал платформе, что страница загрузилась.
     Без этого VK бесконечно показывает свой собственный лоадер поверх приложения. -->

  try {
    if (window.vkBridge) {
      vkBridge.send('VKWebAppInit', {});
    }
  } catch (e) {
    // если открыто не внутри VK (просто в браузере) — просто игнорируем
  }

<canvas id="gameCanvas"></canvas>

<div id="hud" style="display:none">
  <div class="hud-box">
    <div id="score">0</div>
    <div id="best">РЕКОРД: 0</div>
  </div>
  <div id="rightHud">
    <div id="hpWrap"></div>
    <div id="shieldWrap"></div>
  </div>
</div>

<div id="hint" style="display:none">Двигай пальцем/мышью — стрельба идёт сама</div>

<div id="upgradeOverlay">
  <div class="box">
    <h2>УЛУЧШЕНИЕ КОРАБЛЯ</h2>
    <div class="sub">Набрано очков: <span id="upgradeScoreVal">0</span></div>
    <div class="choices">
      <button id="upgradeLifeBtn" class="upgradeBtn">+1 Жизнь</button>
      <button id="upgradeShieldBtn" class="upgradeBtn shieldBtn">Щит</button>
    </div>
  </div>
</div>

<div id="overlay">
  <h1>STAR RAIDER</h1>
  <div class="sub">Уклоняйся, стреляй по роботам-дронам и набирай очки.<br>Одно столкновение — и миссия окончена.</div>
  <div id="currencyLine">Очки за роботов: <span id="currencyVal">0</span></div>
  <div id="colorPicker"></div>
  <button id="playBtn">ИГРАТЬ</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', resize);
  }
  resize();
  // iOS sometimes reports a stale viewport size right after load
  setTimeout(resize, 300);

  // ---------- state ----------
  let state = 'menu'; // menu | playing | dead
  let score = 0;
  let best = parseInt(localStorage.getItem('sr_best') || '0', 10);

  // ---------- currency & ship colors ----------
  let currency = parseInt(localStorage.getItem('sr_currency') || '0', 10);
  let unlockedColors = JSON.parse(localStorage.getItem('sr_unlocked') || '["blue"]');
  let shipColor = localStorage.getItem('sr_shipcolor') || 'blue';

  const SHIP_COLORS = {
    blue:  { name: 'Синий',   price: 0,   light:'#eafcff', mid:'#7fd9ff', dark:'#1a6fbf', wing:'#ff5fae', glow:'#4dd8ff' },
    red:   { name: 'Красный', price: 60,  light:'#ffe3e3', mid:'#ff5f5f', dark:'#7a1414', wing:'#ffd76a', glow:'#ff6a4d' },
    black: { name: 'Чёрный',  price: 120, light:'#c7ccd1', mid:'#4a4f57', dark:'#08090b', wing:'#4dd8ff', glow:'#8fa0b3' },
    green: { name: 'Зелёный', price: 180, light:'#e6ffe0', mid:'#4fd85c', dark:'#0f5c1a', wing:'#ffd76a', glow:'#7dffb0' }
  };

  function saveCurrency(){ localStorage.setItem('sr_currency', currency); }
  function saveUnlocked(){ localStorage.setItem('sr_unlocked', JSON.stringify(unlockedColors)); }
  function saveShipColor(){ localStorage.setItem('sr_shipcolor', shipColor); }

  function renderColorPicker(){
    const wrap = document.getElementById('colorPicker');
    const valEl = document.getElementById('currencyVal');
    if(!wrap) return;
    if(valEl) valEl.textContent = currency;
    wrap.innerHTML = '';
    Object.keys(SHIP_COLORS).forEach(key=>{
      const c = SHIP_COLORS[key];
      const owned = unlockedColors.includes(key);
      const btn = document.createElement('div');
      btn.className = 'colorSwatch' + (key===shipColor ? ' selected' : '') + (!owned ? ' locked' : '');
      btn.style.background = `radial-gradient(circle at 35% 30%, ${c.light}, ${c.mid} 55%, ${c.dark})`;
      btn.title = c.name;
      if(!owned){
        const price = document.createElement('div');
        price.className = 'price';
        price.textContent = c.price;
        btn.appendChild(price);
      }
      btn.addEventListener('click', ()=>{
        if(unlockedColors.includes(key)){
          shipColor = key;
          saveShipColor();
          renderColorPicker();
        } else if(currency >= c.price){
          currency -= c.price;
          unlockedColors.push(key);
          shipColor = key;
          saveCurrency(); saveUnlocked(); saveShipColor();
          renderColorPicker();
        }
      });
      wrap.appendChild(btn);
    });
  }
  const MAX_HP = 5;
  let maxHP = 3;
  let hp = maxHP;
  let shield = 0;
  const MAX_SHIELD = 3;
  let nextUpgradeScore = 1000;
  const ROBOT_SHOOT_SCORE = 2000;
  let t = 0;
  let shakeTime = 0, shakeMag = 0;
  let spawnTimer = 0;
  let spawnInterval = 70;
  let difficulty = 1;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const hud = document.getElementById('hud');
  const hint = document.getElementById('hint');
  const overlay = document.getElementById('overlay');
  const playBtn = document.getElementById('playBtn');
  const hpWrap = document.getElementById('hpWrap');
  const shieldWrap = document.getElementById('shieldWrap');
  const upgradeOverlay = document.getElementById('upgradeOverlay');
  const upgradeScoreVal = document.getElementById('upgradeScoreVal');
  const upgradeLifeBtn = document.getElementById('upgradeLifeBtn');
  const upgradeShieldBtn = document.getElementById('upgradeShieldBtn');
  bestEl.textContent = 'РЕКОРД: ' + best;

  function renderHP(){
    hpWrap.innerHTML = '';
    for(let i=0;i<maxHP;i++){
      const d = document.createElement('div');
      d.className = 'hp-pip' + (i < hp ? '' : ' off');
      hpWrap.appendChild(d);
    }
  }

  function renderShield(){
    shieldWrap.innerHTML = '';
    for(let i=0;i<shield;i++){
      const d = document.createElement('div');
      d.className = 'shield-pip';
      shieldWrap.appendChild(d);
    }
  }

  // ---------- ship upgrades (every 1000 points) ----------
  function maybeShowUpgrade(){
    if(state==='playing' && score >= nextUpgradeScore){
      state = 'upgrade';
      upgradeScoreVal.textContent = Math.floor(score);
      if(maxHP >= MAX_HP){
        upgradeLifeBtn.style.display = 'none';
      } else {
        upgradeLifeBtn.style.display = 'inline-block';
        upgradeLifeBtn.textContent = '+1 Жизнь';
      }
      if(shield >= MAX_SHIELD){
        upgradeShieldBtn.style.display = 'none';
      } else {
        upgradeShieldBtn.style.display = 'inline-block';
      }
      upgradeOverlay.style.display = 'flex';
    }
  }

  function closeUpgrade(){
    upgradeOverlay.style.display = 'none';
    nextUpgradeScore += 1000;
    if(state==='upgrade') state = 'playing';
  }

  upgradeLifeBtn.addEventListener('click', ()=>{
    if(maxHP < MAX_HP){
      maxHP++;
      hp = Math.min(maxHP, hp+1);
      renderHP();
    }
    closeUpgrade();
  });

  upgradeShieldBtn.addEventListener('click', ()=>{
    if(shield < MAX_SHIELD){
      shield++;
      renderShield();
    }
    closeUpgrade();
  });

  const bgImg = new Image();
  let bgLoaded = false;
  bgImg.onload = () => { bgLoaded = true; };
  bgImg.src = BG_SRC;

  let scrollX = 0;
  function drawCityBg(dtScale){
    if(!bgLoaded){
      ctx.fillStyle = '#3a1420';
      ctx.fillRect(0,0,W,H);
      return;
    }
    const scaledH = H;
    const scaledW = bgImg.width * (scaledH / bgImg.height);
    scrollX += 1.3 * dtScale;

    const startI = Math.floor(scrollX / scaledW) - 1;
    const endI = Math.ceil((scrollX + W) / scaledW) + 1;
    for(let i = startI; i <= endI; i++){
      const screenX = i*scaledW - scrollX;
      const mirror = (((i % 2) + 2) % 2) === 1;
      ctx.save();
      if(mirror){
        ctx.translate(screenX + scaledW, 0);
        ctx.scale(-1,1);
        ctx.drawImage(bgImg, 0, 0, scaledW, scaledH);
      } else {
        ctx.drawImage(bgImg, screenX, 0, scaledW, scaledH);
      }
      ctx.restore();
    }

    // subtle dark vignette at the bottom so HUD/gameplay reads clearly
    const vg = ctx.createLinearGradient(0, H*0.7, 0, H);
    vg.addColorStop(0, 'rgba(10,5,10,0)');
    vg.addColorStop(1, 'rgba(10,5,10,0.35)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, H*0.7, W, H*0.3);
  }

  // ---------- player ----------
  const player = {
    x: 0, y: 0, r: 20,
    tx: 0, ty: 0,
    vx: 0, vy: 0,
    tilt: 0,
    invuln: 0,
    thrusterPulse: 0
  };
  function resetPlayer(){
    player.x = W*0.16; player.y = H*0.5;
    player.tx = player.x; player.ty = player.y;
    player.vx = 0; player.vy = 0;
    player.tilt = 0;
    player.invuln = 90;
  }

  // ---------- entities ----------
  let bullets = [];
  let enemies = [];
  let enemyBullets = [];
  let particles = [];
  let stars2 = []; // pickup sparkles unused placeholder

  function spawnEnemy(){
    const size = 22 + Math.random()*14;
    const y = size + Math.random()*(H - size*2);
    const speed = (1.6 + Math.random()*1.6) * difficulty;
    const type = Math.random() < 0.25 ? 'zig' : (Math.random() < 0.5 ? 'heavy' : 'basic');
    enemies.push({
      x: W + size*2, y, r: type==='heavy'? size*1.25 : size,
      speed, type,
      hp: type==='heavy' ? 3 : 1,
      maxHp: type==='heavy' ? 3 : 1,
      phase: Math.random()*Math.PI*2,
      rot: 0,
      rotSpeed: (Math.random()-0.5)*0.06,
      shootTimer: 60 + Math.random()*120
    });
  }

  function shootEnemyBullet(e){
    enemyBullets.push({ x: e.x - e.r, y: e.y, vx: -(7 + difficulty), r: 4 });
  }

  function shoot(){
    bullets.push({ x: player.x + player.r, y: player.y, vx: 11, r: 4 });
    // slight side sparks
    spawnParticles(player.x + player.r, player.y, 2, '#8fe7ff', 1.5, 0.6);
  }
  let shootTimer = 0;

  function spawnParticles(x,y,count,color,speed,life){
    for(let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const sp = (0.4+Math.random()*0.6)*speed;
      particles.push({
        x, y,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: life + Math.random()*life,
        maxLife: life,
        color,
        r: 1.5 + Math.random()*2.5
      });
    }
  }

  function explode(x,y,big){
    const n = big ? 40 : 16;
    const colors = big ? ['#ff5f5f','#ffb84d','#fff2b0'] : ['#7fe8ff','#ffffff','#4dd0ff'];
    for(let i=0;i<n;i++){
      spawnParticles(x,y,1, colors[Math.floor(Math.random()*colors.length)], big? 6:3.2, big? 1.1:0.7);
    }
    shakeTime = big? 22 : 8;
    shakeMag = big? 14 : 5;
  }

  // ---------- input ----------
  let pointerActive = false;
  function setPointer(clientX, clientY){
    player.tx = clientX;
    player.ty = clientY;
  }
  canvas.addEventListener('mousemove', e=>{ if(state==='playing') setPointer(e.clientX, e.clientY); });
  canvas.addEventListener('touchmove', e=>{
    if(state==='playing'){
      e.preventDefault();
      const touch = e.touches[0];
      setPointer(touch.clientX, touch.clientY - 40);
    }
  }, {passive:false});
  canvas.addEventListener('touchstart', e=>{
    if(state==='playing'){
      const touch = e.touches[0];
      setPointer(touch.clientX, touch.clientY - 40);
    }
  }, {passive:false});

  // ---------- ship drawing ----------
  function drawShip(){
    const p = player;
    const colScheme = SHIP_COLORS[shipColor] || SHIP_COLORS.blue;
    const blinking = p.invuln > 0 && Math.floor(p.invuln/4)%2===0;
    if(blinking) ctx.globalAlpha = 0.4;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.PI/2 + p.tilt);

    // thruster flame
    const flameLen = 14 + Math.sin(t*0.6)*4 + player.thrusterPulse;
    const fg = ctx.createLinearGradient(0, p.r*0.6, 0, p.r*0.6+flameLen);
    fg.addColorStop(0, 'rgba(120,220,255,0.95)');
    fg.addColorStop(0.5, 'rgba(80,160,255,0.6)');
    fg.addColorStop(1, 'rgba(80,160,255,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(-6, p.r*0.55);
    ctx.lineTo(0, p.r*0.55+flameLen);
    ctx.lineTo(6, p.r*0.55);
    ctx.closePath();
    ctx.fill();

    // glow
    ctx.shadowColor = colScheme.glow;
    ctx.shadowBlur = 22;

    // body
    const bodyGrad = ctx.createLinearGradient(0,-p.r,0,p.r);
    bodyGrad.addColorStop(0, colScheme.light);
    bodyGrad.addColorStop(0.5, colScheme.mid);
    bodyGrad.addColorStop(1, colScheme.dark);
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(0, -p.r*1.15);
    ctx.quadraticCurveTo(p.r*0.9, p.r*0.2, p.r*0.75, p.r*0.75);
    ctx.lineTo(p.r*0.25, p.r*0.5);
    ctx.lineTo(-p.r*0.25, p.r*0.5);
    ctx.lineTo(-p.r*0.75, p.r*0.75);
    ctx.quadraticCurveTo(-p.r*0.9, p.r*0.2, 0, -p.r*1.15);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
    // cockpit
    ctx.fillStyle = '#062a3f';
    ctx.beginPath();
    ctx.ellipse(0, -p.r*0.15, p.r*0.28, p.r*0.4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(180,240,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(-p.r*0.08, -p.r*0.28, p.r*0.1, p.r*0.16, -0.4, 0, Math.PI*2);
    ctx.fill();

    // wing accents
    ctx.fillStyle = colScheme.wing;
    ctx.beginPath();
    ctx.moveTo(p.r*0.75, p.r*0.75);
    ctx.lineTo(p.r*0.95, p.r*0.55);
    ctx.lineTo(p.r*0.55, p.r*0.55);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-p.r*0.75, p.r*0.75);
    ctx.lineTo(-p.r*0.95, p.r*0.55);
    ctx.lineTo(-p.r*0.55, p.r*0.55);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ---------- enemy drawing (mechanical robots) ----------
  function roundRectPath(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawEnemy(e){
    const dmg = 1 - e.hp/e.maxHp;
    const isHeavy = e.type === 'heavy';
    const isZig = e.type === 'zig';

    let primary, primaryLight, primaryDark;
    if(isHeavy){ primary='#c23b3b'; primaryLight='#ff9d9d'; primaryDark='#5c1414'; }
    else if(isZig){ primary='#7a5cff'; primaryLight='#c3b3ff'; primaryDark='#2b1966'; }
    else { primary='#ff8a3d'; primaryLight='#ffd19b'; primaryDark='#7a3a0f'; }

    const metal = '#9aa7b6';
    const metalDark = '#3d444d';

    ctx.save();
    ctx.translate(e.x, e.y);
    const bank = Math.sin(t*0.05 + e.phase) * (isZig ? 0.28 : 0.12);
    ctx.rotate(bank);
    const scale = e.r / 26;
    ctx.scale(scale, scale);

    const armSwing = Math.sin(t*0.09 + e.phase) * 0.3;
    const legPulse = Math.sin(t*0.16 + e.phase) * 3;

    // legs / thruster struts (drawn first, behind torso)
    [-1,1].forEach(side=>{
      ctx.save();
      ctx.translate(side*9, 14 + legPulse*0.25);
      ctx.rotate(side*0.18);
      ctx.fillStyle = metalDark;
      ctx.fillRect(-3,0,6,13);
      ctx.restore();

      const flameLen = 8 + Math.abs(legPulse);
      const fg = ctx.createLinearGradient(0,27,0,27+flameLen);
      fg.addColorStop(0,'rgba(150,220,255,0.9)');
      fg.addColorStop(1,'rgba(150,220,255,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(side*9-3,27);
      ctx.lineTo(side*9,27+flameLen);
      ctx.lineTo(side*9+3,27);
      ctx.closePath();
      ctx.fill();
    });

    // arms with elbow joint + claw
    [-1,1].forEach(side=>{
      ctx.save();
      ctx.translate(side*13,-3);
      ctx.rotate(side*(0.55+armSwing));
      ctx.fillStyle = metal;
      ctx.fillRect(-3,0,6,15);
      ctx.translate(0,15);
      ctx.rotate(side*-0.7);
      ctx.fillStyle = metalDark;
      ctx.fillRect(-3.5,0,7,11);
      ctx.fillStyle = primary;
      ctx.beginPath();
      ctx.moveTo(-4.5,11); ctx.lineTo(0,19); ctx.lineTo(4.5,11);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    // torso
    ctx.shadowColor = primary;
    ctx.shadowBlur = 15;
    const torsoH = isHeavy ? 32 : 26;
    const torsoGrad = ctx.createLinearGradient(0,-14,0,torsoH-14);
    torsoGrad.addColorStop(0, primaryLight);
    torsoGrad.addColorStop(0.55, primary);
    torsoGrad.addColorStop(1, primaryDark);
    ctx.fillStyle = torsoGrad;
    roundRectPath(-14,-14,28,torsoH,6);
    ctx.fill();
    ctx.shadowBlur = 0;

    // shoulder armor (heavy only)
    if(isHeavy){
      ctx.fillStyle = metalDark;
      ctx.beginPath(); ctx.arc(-15,-7,6.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(15,-7,6.5,0,Math.PI*2); ctx.fill();
    }

    // panel seam + rivets
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-13,-1); ctx.lineTo(13,-1); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    [[-10,-10],[10,-10],[-10,torsoH-16],[10,torsoH-16]].forEach(([rx,ry])=>{
      ctx.beginPath(); ctx.arc(rx,ry,1.3,0,Math.PI*2); ctx.fill();
    });

    // reactor core
    const corePulse = 0.6 + Math.sin(t*0.2+e.phase)*0.4;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 6 + corePulse*6;
    ctx.fillStyle = `rgba(255,255,255,${0.5+corePulse*0.3})`;
    ctx.beginPath(); ctx.arc(0,3,3.6,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // head
    ctx.fillStyle = metal;
    roundRectPath(-9,-26,18,13,4);
    ctx.fill();
    ctx.fillStyle = metalDark;
    ctx.fillRect(-9,-16,18,2.5);

    // eye
    const eyePulse = 0.5 + Math.sin(t*0.3+e.phase)*0.5;
    ctx.shadowColor = 'red';
    ctx.shadowBlur = 8 + eyePulse*8;
    ctx.fillStyle = `rgba(255,${50+eyePulse*40},${50+eyePulse*40},1)`;
    ctx.beginPath(); ctx.ellipse(0,-19.5,6,3,0,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // antenna
    ctx.strokeStyle = metal;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,-26); ctx.lineTo(0,-33); ctx.stroke();
    ctx.fillStyle = isHeavy ? '#ff5f5f' : '#ffd76a';
    ctx.beginPath(); ctx.arc(0,-33,2.4,0,Math.PI*2); ctx.fill();

    ctx.restore();

    // damage flash overlay
    if(dmg > 0){
      ctx.save();
      ctx.globalAlpha = dmg*0.5;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r*0.9, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ---------- game loop pieces ----------
  function updatePlayer(dt){
    // ease toward target
    player.vx += (player.tx - player.x) * 0.16 * dt;
    player.vy += (player.ty - player.y) * 0.16 * dt;
    player.vx *= Math.pow(0.72, dt);
    player.vy *= Math.pow(0.72, dt);
    player.x += player.vx * dt;
    player.y += player.vy * dt;

    player.x = Math.max(player.r, Math.min(W*0.62, player.x));
    player.y = Math.max(player.r, Math.min(H-player.r, player.y));

    player.tilt = Math.max(-0.5, Math.min(0.5, player.vy*0.05));
    player.thrusterPulse = Math.min(10, Math.abs(player.vx)+Math.abs(player.vy));

    if(player.invuln>0) player.invuln -= dt;
  }

  function updateBullets(dt){
    for(let i=bullets.length-1;i>=0;i--){
      const b = bullets[i];
      b.x += b.vx * dt;
      if(b.x > W+20) bullets.splice(i,1);
    }
  }

  function updateEnemyBullets(dt){
    for(let i=enemyBullets.length-1;i>=0;i--){
      const eb = enemyBullets[i];
      eb.x += eb.vx * dt;
      if(eb.x < -20){ enemyBullets.splice(i,1); continue; }
      if(state==='playing' && player.invuln<=0){
        const dx = player.x-eb.x, dy = player.y-eb.y;
        const rad = player.r*0.7 + eb.r;
        if(dx*dx+dy*dy < rad*rad){
          enemyBullets.splice(i,1);
          onPlayerHit(eb.x, eb.y);
        }
      }
    }
  }

  function updateEnemies(dt){
    for(let i=enemies.length-1;i>=0;i--){
      const e = enemies[i];
      e.x -= e.speed * dt;
      e.rot += e.rotSpeed * dt;
      if(e.type==='zig'){
        e.y += Math.sin(t*0.05 + e.phase) * 2.4 * dt;
        e.y = Math.max(e.r, Math.min(H-e.r, e.y));
      }
      if(e.x + e.r < 0){
        enemies.splice(i,1);
        continue;
      }
      if(state==='playing' && score >= ROBOT_SHOOT_SCORE && e.x < W-10){
        e.shootTimer -= dt;
        if(e.shootTimer<=0){
          shootEnemyBullet(e);
          e.shootTimer = 70 + Math.random()*100;
        }
      }
      // bullet collision
      for(let j=bullets.length-1;j>=0;j--){
        const b = bullets[j];
        const dx = b.x-e.x, dy = b.y-e.y;
        if(dx*dx+dy*dy < (e.r+b.r)*(e.r+b.r)){
          bullets.splice(j,1);
          e.hp--;
          spawnParticles(b.x,b.y,6,'#ffd76a',3,0.4);
          if(e.hp<=0){
            explode(e.x, e.y, e.type==='heavy');
            enemies.splice(i,1);
            score += e.type==='heavy' ? 30 : (e.type==='zig' ? 20 : 10);
            currency += e.type==='heavy' ? 3 : (e.type==='zig' ? 2 : 1);
            saveCurrency();
          }
          break;
        }
      }
      // player collision
      if(state==='playing' && enemies[i]){
        const ee = enemies[i];
        const dx = player.x-ee.x, dy = player.y-ee.y;
        const rad = player.r*0.75+ee.r*0.85;
        if(dx*dx+dy*dy < rad*rad && player.invuln<=0){
          onPlayerHit(ee.x, ee.y);
          enemies.splice(i,1);
        }
      }
    }
  }

  function onPlayerHit(ex,ey){
    if(shield > 0){
      shield--;
      renderShield();
      explode((player.x+ex)/2, (player.y+ey)/2, false);
      player.invuln = 60;
      return;
    }
    hp--;
    renderHP();
    explode((player.x+ex)/2, (player.y+ey)/2, true);
    player.invuln = 100;
    if(hp<=0){
      endGame();
    }
  }

  function updateParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= Math.pow(0.96, dt); p.vy *= Math.pow(0.96, dt);
      p.life -= dt/60;
      if(p.life<=0) particles.splice(i,1);
    }
  }

  function drawBullets(){
    for(const b of bullets){
      ctx.save();
      ctx.shadowColor = '#8fe7ff';
      ctx.shadowBlur = 12;
      const g = ctx.createLinearGradient(b.x-10,b.y,b.x+6,b.y);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(1,'#bff3ff');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(b.x,b.y,10,b.r*0.6,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawEnemyBullets(){
    for(const b of enemyBullets){
      ctx.save();
      ctx.shadowColor = '#ff7a4d';
      ctx.shadowBlur = 12;
      const g = ctx.createLinearGradient(b.x+10,b.y,b.x-6,b.y);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(1,'#ffb27a');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(b.x,b.y,10,b.r*0.6,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawParticles(){
    for(const p of particles){
      const a = Math.max(0, p.life/p.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*a,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function updateDifficulty(){
    difficulty = 1 + score/400;
    spawnInterval = Math.max(24, 70 - score/12);
  }

  // ---------- main loop ----------
  let lastTime = performance.now();
  function loop(now){
    requestAnimationFrame(loop);
    const rawDt = (now - lastTime) / 16.6667; // 1 = one frame at 60fps
    lastTime = now;
    const dt = Math.max(0, Math.min(3, rawDt)); // clamp to avoid huge jumps (tab switch, lag spikes)
    t += dt;

    ctx.save();
    if(shakeTime>0){
      shakeTime -= dt;
      const dx = (Math.random()-0.5)*shakeMag;
      const dy = (Math.random()-0.5)*shakeMag;
      ctx.translate(dx,dy);
    }

    drawCityBg((state==='playing' || state==='upgrade' ? 1 : 0.3) * dt);

    if(state==='playing'){
      updateDifficulty();
      updatePlayer(dt);

      shootTimer -= dt;
      if(shootTimer<=0){ shoot(); shootTimer = 8; }

      spawnTimer -= dt;
      if(spawnTimer<=0){ spawnEnemy(); spawnTimer = spawnInterval + Math.random()*20; }

      updateBullets(dt);
      updateEnemies(dt);
      updateEnemyBullets(dt);
      updateParticles(dt);

      score += 0.12 * dt;
      scoreEl.textContent = Math.floor(score);

      maybeShowUpgrade();
    } else {
      updateParticles(dt);
    }

    drawParticles();
    for(const e of enemies) drawEnemy(e);
    drawBullets();
    drawEnemyBullets();
    if(state==='playing' || state==='dead' || state==='upgrade') drawShip();

    ctx.restore();
  }

  // ---------- game flow ----------
  function startGame(){
    score = 0;
    maxHP = 3;
    hp = maxHP;
    shield = 0;
    nextUpgradeScore = 1000;
    bullets = []; enemies = []; enemyBullets = []; particles = [];
    spawnTimer = 40;
    resetPlayer();
    renderHP();
    renderShield();
    upgradeOverlay.style.display = 'none';
    state = 'playing';
    overlay.style.display = 'none';
    hud.style.display = 'flex';
    hint.style.display = 'block';
    setTimeout(()=>{ hint.style.display='none'; }, 2600);
  }

  function endGame(){
    state = 'dead';
    hud.style.display = 'none';
    hint.style.display = 'none';
    const finalScore = Math.floor(score);
    if(finalScore > best){
      best = finalScore;
      localStorage.setItem('sr_best', best);
    }
    bestEl.textContent = 'РЕКОРД: ' + best;

    overlay.innerHTML = `
      <div class="finalLabel">Миссия окончена</div>
      <div class="finalScore">${finalScore}</div>
      <div class="bestLine">★ Рекорд: ${best}</div>
      <div id="currencyLine">Очки за роботов: <span id="currencyVal">0</span></div>
      <div id="colorPicker"></div>
      <button id="playBtn">ЕЩЁ РАЗ</button>
    `;
    overlay.style.display = 'flex';
    renderColorPicker();
    document.getElementById('playBtn').addEventListener('click', startGame);
  }

  renderColorPicker();
  playBtn.addEventListener('click', startGame);

  requestAnimationFrame(loop);
})();
</script>
</body>
